# Copy to config.yaml in the directory where you run the bot. Never commit your real token.
# Restrict the channel's visibility in Discord; allowedUsers only restricts who can interact.
discordToken: "YOUR_DISCORD_BOT_TOKEN"
servers:
  - serverId: "YOUR_DISCORD_SERVER_ID"
    channels:
      - channelId: "YOUR_PRIVATE_CHANNEL_ID"
        projectPath: "../your-project"
        allowedUsers: ["YOUR_DISCORD_USER_ID"]
        permissions: interactive
        autoConnect: true
